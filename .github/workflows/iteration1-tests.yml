name: BTTS Iteration 1 feature checks
on:
  push:
    paths:
      - 'src/iteration1_features.py'
      - 'tests/test_iteration1_features.py'
      - 'app.py'
      - 'notebooks/01_btts_model_training.ipynb'
      - '.github/workflows/iteration1-tests.yml'
  pull_request:
    paths:
      - 'src/iteration1_features.py'
      - 'tests/test_iteration1_features.py'
      - 'app.py'
      - 'notebooks/01_btts_model_training.ipynb'
jobs:
  feature-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install numpy pandas pytest
      - run: python -m pytest -q tests/test_iteration1_features.py
      - run: python -m compileall -q src/iteration1_features.py app.py
